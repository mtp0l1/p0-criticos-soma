<!doctype html>
<html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/bundle.css"><script src="../assets/react.production.min.js"></script><script src="../assets/react-dom.production.min.js"></script><script src="../assets/bundle.js"></script><meta charset="utf-8"><title>Icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
</head>
<body class="m-0 p-small bg-background text-foreground font-sans">
<div id="root" class="grid gap-mini" style="max-width:620px"></div>
<script>
var S = window.Soma, h = React.createElement, F = React.Fragment, useState = React.useState;
function K(t){ return h('p', {className:'caption m-0 text-muted-foreground'}, t); }
function Row(){ return h.apply(null, ['div', {className:'flex flex-wrap items-center gap-nano'}].concat([].slice.call(arguments))); }
var noFocus = { onOpenAutoFocus: function(e){ e.preventDefault(); } };
// Na página do sistema, os previews abrem sem modal (sem trava de rolagem) e com a película desenhada à parte.
function Scrim(){ return h('div',{className:'fixed inset-0 z-40 bg-overlay','aria-hidden':true}); }
function Demo(){ var names=Object.keys(S.ICONS); return h(F,null,
  h('div',{className:'grid grid-cols-8 gap-x-nano gap-y-micro'}, names.map(function(n){ return h('div',{key:n,className:'grid justify-items-center gap-xnano'}, h(S.Icon,{name:n,tone:'primary'}), h('span',{className:'text-[10px] leading-3 text-muted-foreground text-center break-all'},n)); })),
  K('Nomes do Figma também valem: '+Object.keys(S.ICON_ALIASES).map(function(a){return a+' → '+S.ICON_ALIASES[a];}).join(' · ')),
  K('size: small 16 · medium 24 · large 32 · xlarge 56 — tone: brand · brand-strong · primary · secondary · positive · negative · info'),
  Row(h(S.Icon,{name:'recycle',size:'small',tone:'brand'}), h(S.Icon,{name:'recycle',tone:'brand-strong'}), h(S.Icon,{name:'recycle',size:'large',tone:'primary'}), h(S.Icon,{name:'recycle',size:'xlarge',tone:'positive'})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
<script>(function(){function s(){parent.postMessage({soma:"h",n:"Icon",h:document.documentElement.scrollHeight},"*")}new ResizeObserver(s).observe(document.body);addEventListener("load",s);setTimeout(s,400)})();</script></body></html>
