<!doctype html>
<html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/bundle.css"><script src="../assets/react.production.min.js"></script><script src="../assets/react-dom.production.min.js"></script><script src="../assets/bundle.js"></script><meta charset="utf-8"><title>QuestionCard</title>
</head>
<body class="m-0 p-small bg-background text-foreground font-sans">
<div id="root" class="grid gap-mini" style="max-width:390px"></div>
<script>
var S = window.Soma, h = React.createElement, F = React.Fragment, useState = React.useState;
function K(t){ return h('p', {className:'caption m-0 text-muted-foreground'}, t); }
function Row(){ return h.apply(null, ['div', {className:'flex flex-wrap items-center gap-nano'}].concat([].slice.call(arguments))); }
var noFocus = { onOpenAutoFocus: function(e){ e.preventDefault(); } };
// Na página do sistema, os previews abrem sem modal (sem trava de rolagem) e com a película desenhada à parte.
function Scrim(){ return h('div',{className:'fixed inset-0 z-40 bg-overlay','aria-hidden':true}); }
var OPTS=['Oxigênio','Dióxido de carbono (CO2)','Nitrogênio','Hidrogênio'];
function Demo(){ var s=useState('Dióxido de carbono (CO2)'); return h(S.QuestionCard,{points:15,question:'Qual desses gases é o "culpado" pelo aquecimento global?',options:OPTS,value:s[0],onChange:s[1],info:'Uma pergunta por dia. Cada acerto avança seu nível.'}); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
<script>(function(){function s(){parent.postMessage({soma:"h",n:"QuestionCard",h:document.documentElement.scrollHeight},"*")}new ResizeObserver(s).observe(document.body);addEventListener("load",s);setTimeout(s,400)})();</script></body></html>
