<!doctype html>
<html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/bundle.css"><script src="../assets/react.production.min.js"></script><script src="../assets/react-dom.production.min.js"></script><script src="../assets/bundle.js"></script><meta charset="utf-8"><title>InputOTP</title>
</head>
<body class="m-0 p-small bg-background text-foreground font-sans">
<div id="root" class="grid gap-mini" style="max-width:390px"></div>
<script>
var S = window.Soma, h = React.createElement, F = React.Fragment, useState = React.useState;
function K(t){ return h('p', {className:'caption m-0 text-muted-foreground'}, t); }
function Row(){ return h.apply(null, ['div', {className:'flex flex-wrap items-center gap-nano'}].concat([].slice.call(arguments))); }
var noFocus = { onOpenAutoFocus: function(e){ e.preventDefault(); } };
// Na página do sistema, os previews abrem sem modal (sem trava de rolagem) e com a película desenhada à parte.
function Scrim(){ return h('div',{className:'fixed inset-0 z-40 bg-overlay','aria-hidden':true}); }
function Demo(){ var v=useState('38'); return h(F,null, h(S.Label,{htmlFor:'otp'},'Código enviado por SMS'),
  h(S.InputOTP,{id:'otp',maxLength:6,value:v[0],onChange:v[1],inputMode:'numeric',autoComplete:'one-time-code'}, h(S.InputOTPGroup,null,[0,1,2,3,4,5].map(function(i){ return h(S.InputOTPSlot,{key:i,index:i}); }))),
  K('Código errado'),
  h(S.InputOTP,{maxLength:6,defaultValue:'381204','aria-label':'Código de verificação','aria-invalid':true}, h(S.InputOTPGroup,null,[0,1,2,3,4,5].map(function(i){ return h(S.InputOTPSlot,{key:i,index:i,invalid:true}); }))),
  h(S.FieldError,null,'Código incorreto. Confira o SMS e tente de novo.')); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
<script>(function(){function s(){parent.postMessage({soma:"h",n:"InputOTP",h:document.documentElement.scrollHeight},"*")}new ResizeObserver(s).observe(document.body);addEventListener("load",s);setTimeout(s,400)})();</script></body></html>
