<!doctype html>
<html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/bundle.css"><script src="../assets/react.production.min.js"></script><script src="../assets/react-dom.production.min.js"></script><script src="../assets/bundle.js"></script><meta charset="utf-8"><title>AnswerResult</title>
</head>
<body class="m-0 p-small bg-background text-foreground font-sans">
<div id="root" class="grid gap-mini" style="max-width:390px"></div>
<script>
var S = window.Soma, h = React.createElement, F = React.Fragment, useState = React.useState;
function K(t){ return h('p', {className:'caption m-0 text-muted-foreground'}, t); }
function Row(){ return h.apply(null, ['div', {className:'flex flex-wrap items-center gap-nano'}].concat([].slice.call(arguments))); }
var noFocus = { onOpenAutoFocus: function(e){ e.preventDefault(); } };
// Na página do sistema, os previews abrem sem modal (sem trava de rolagem) e com a película desenhada à parte.
function Scrim(){ return h('div',{className:'fixed inset-0 z-40 bg-overlay','aria-hidden':true}); }
var EXP='O CO₂ é o principal gás responsável pelo efeito estufa. Ele é liberado pela queima de combustíveis fósseis e desmatamento.';
function Demo(){ var t=useState('certa'); return h(F,null, h(S.SegmentedControl,{label:'Resultado',value:t[0],onChange:t[1],items:[{id:'certa',label:'Acertou'},{id:'errada',label:'Errou'}]}),
  h('div',{className:'h-[704px] overflow-hidden rounded-lg border border-border bg-background'}, t[0]==='certa'
   ? h(S.AnswerResult,{correct:true,answer:'Dióxido de Carbono (CO₂)',explanation:EXP,points:15,weeks:2,onContinue:function(){},secondary:{label:'Convidar amigos'}})
   : h(S.AnswerResult,{correct:false,answer:'Dióxido de Carbono (CO₂)',explanation:EXP,onContinue:function(){},secondary:{label:'Volte amanhã para a próxima pergunta'}}))); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
<script>(function(){function s(){parent.postMessage({soma:"h",n:"AnswerResult",h:document.documentElement.scrollHeight},"*")}new ResizeObserver(s).observe(document.body);addEventListener("load",s);setTimeout(s,400)})();</script></body></html>
