<!doctype html>
<html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/bundle.css"><script src="../assets/react.production.min.js"></script><script src="../assets/react-dom.production.min.js"></script><script src="../assets/bundle.js"></script><meta charset="utf-8"><title>TelaDoar</title>
</head>
<body class="m-0 p-0 bg-background-secondary text-foreground font-sans">
<div id="root" class="grid gap-mini" style="max-width:360px"></div>
<script>
var S = window.Soma, h = React.createElement, F = React.Fragment, useState = React.useState;
function K(t){ return h('p', {className:'caption m-0 text-muted-foreground'}, t); }
function Row(){ return h.apply(null, ['div', {className:'flex flex-wrap items-center gap-nano'}].concat([].slice.call(arguments))); }
var noFocus = { onOpenAutoFocus: function(e){ e.preventDefault(); } };
// Na página do sistema, os previews abrem sem modal (sem trava de rolagem) e com a película desenhada à parte.
function Scrim(){ return h('div',{className:'fixed inset-0 z-40 bg-overlay','aria-hidden':true}); }
function Demo(){ var v=useState(500), m=useState(false); var err=S.donationError(v[0],1130); var ok=v[0]!==null && !err;
  return h('div',{className:'flex min-h-[780px] flex-col bg-background-secondary'},
  h(S.Header,{title:'Doar pontos',onBack:function(){},action:{icon:'help',label:'Ajuda'}}),
  h('main',{className:'grid flex-1 content-start gap-xsmall px-xsmall pt-mini'},
    h(S.InstitutionCard,{name:'Associação S. Francisco de Assis para Proteção aos Animais',description:'Abrigo, cuidados veterinários e adoção responsável de animais resgatados.',onMore:function(){ m[1](true); }}),
    h(S.DonationAmountCard,{balance:1130,value:v[0],onChange:v[1]}),
    h('div',{className:'pt-micro'}, h(S.Button,{fullWidth:true,disabled:!ok},'Doar'))),
  h(S.InstitutionDetailModal,{open:m[0],onOpenChange:m[1],modal:false,name:'Associação S. Francisco de Assis para Proteção aos Animais',description:'A Associação S. Francisco de Assis para Proteção aos Animais é uma organização sem fins lucrativos dedicada ao resgate, abrigo e reabilitação de animais em situação de vulnerabilidade. Fundada em 2005, a instituição já resgatou mais de 3.000 animais.',address:'Rua das Flores, 123 - São Paulo, SP',phone:'(11) 98765-4321',site:'www.saofranciscoanimais.org.br'}),
  h(S.TabBar,{active:'recompensas'})); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
<script>(function(){function s(){parent.postMessage({soma:"h",n:"TelaDoar",h:document.documentElement.scrollHeight},"*")}new ResizeObserver(s).observe(document.body);addEventListener("load",s);setTimeout(s,400)})();</script></body></html>
