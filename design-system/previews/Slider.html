<!doctype html>
<html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/bundle.css"><script src="../assets/react.production.min.js"></script><script src="../assets/react-dom.production.min.js"></script><script src="../assets/bundle.js"></script><meta charset="utf-8"><title>Slider</title>
</head>
<body class="m-0 p-small bg-background text-foreground font-sans">
<div id="root" class="grid gap-mini" style="max-width:390px"></div>
<script>
var S = window.Soma, h = React.createElement, F = React.Fragment, useState = React.useState;
function K(t){ return h('p', {className:'caption m-0 text-muted-foreground'}, t); }
function Row(){ return h.apply(null, ['div', {className:'flex flex-wrap items-center gap-nano'}].concat([].slice.call(arguments))); }
var noFocus = { onOpenAutoFocus: function(e){ e.preventDefault(); } };
// Na página do sistema, os previews abrem sem modal (sem trava de rolagem) e com a película desenhada à parte.
function Scrim(){ return h('div',{className:'fixed inset-0 z-40 bg-overlay','aria-hidden':true}); }
function Demo(){ var v=useState([500]), r=useState([2,8]); return h(F,null,
  h('div',{className:'flex items-baseline justify-between'}, h(S.Label,{id:'sl'},'Pontos para doar'), h('span',{className:'label text-text-link'},v[0][0].toLocaleString('pt-BR')+' pontos')),
  h(S.Slider,{value:v[0],onValueChange:v[1],min:0,max:1130,step:10,'aria-label':'Pontos para doar'}),
  K('Faixa com duas alças'), h(S.Slider,{value:r[0],onValueChange:r[1],min:0,max:10,step:1,thumbLabels:['Distância mínima em km','Distância máxima em km']}),
  K('Desabilitado'), h(S.Slider,{defaultValue:[40],disabled:true,'aria-label':'Indisponível'})); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
<script>(function(){function s(){parent.postMessage({soma:"h",n:"Slider",h:document.documentElement.scrollHeight},"*")}new ResizeObserver(s).observe(document.body);addEventListener("load",s);setTimeout(s,400)})();</script></body></html>
