name: Verificar site
on:
  pull_request:
  push:
    branches: [main]
jobs:
  sintaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Sintaxe de todos os módulos do site
        working-directory: design-system
        run: |
          erro=0
          for f in site/pages/*.js site/nav.js site/app.js site/search-index.js site/aliases.js ds/js/*.js; do
            node --check --input-type=module < "$f" > /dev/null 2>&1 || { echo "::error file=design-system/$f::erro de sintaxe"; erro=1; }
          done
          exit $erro
